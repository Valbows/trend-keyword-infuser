name: CI Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Define global environment variables for all steps
      # Map the GitHub secrets to the environment variable names expected by the application
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}  # Map service key to SUPABASE_KEY for compatibility
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}  # Also support SUPABASE_ANON_KEY naming
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      NODE_ENV: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json' # Cache based on all lock files in the repo

      - name: Install Root Dependencies
        run: npm install

      - name: Install Frontend Dependencies
        run: npm install --prefix frontend

      - name: Run Linter
        run: npm run lint --prefix frontend

      - name: Check Formatting
        run: npm run check-format

      - name: Run Frontend Tests
        run: npm test --prefix frontend

      - name: Build Frontend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NODE_ENV: production
        run: |
          echo "Building frontend with environment variables..."
          cd frontend
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env.production
          echo "SUPABASE_KEY=$SUPABASE_KEY" >> .env.production
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env.production
          npm run build
        
      - name: Validate Environment Variables
        run: |
          echo "Validating environment variables availability..."
          if [ -z "$SUPABASE_URL" ]; then
            echo "Error: SUPABASE_URL is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_KEY" ]; then
            echo "Error: SUPABASE_KEY is not set"
            exit 1
          fi
          echo "Environment validation successful - all required variables are present"
