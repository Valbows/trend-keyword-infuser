name: CI Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json' # Cache based on all lock files in the repo

      - name: Install Root Dependencies
        run: npm install

      - name: Install Frontend Dependencies
        run: npm install --prefix frontend

      - name: Install Backend Dependencies
        run: npm install --prefix backend

      - name: Verify Backend Config Files
        run: |
          echo "Listing backend directory contents:"
          ls -la backend
          echo "-----------------------------------------------------"
          echo "Attempting to display backend/.prettierrc.json (if it exists):"
          cat backend/.prettierrc.json || echo "backend/.prettierrc.json not found or cat failed."
          echo "-----------------------------------------------------"
          echo "Attempting to display backend/.prettierrc.yaml (if it exists):"
          cat backend/.prettierrc.yaml || echo "backend/.prettierrc.yaml not found or cat failed."
          echo "-----------------------------------------------------"
          echo "Contents of backend/eslint.config.mjs:"
          cat backend/eslint.config.mjs || echo "backend/eslint.config.mjs not found or cat failed."
          echo "-----------------------------------------------------"

      - name: Run Linters (Frontend & Backend)
        run: npm run lint

      - name: Check Formatting (Frontend & Backend)
        run: npm run check-format

      - name: Run Backend Tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NODE_ENV: test # Explicitly setting NODE_ENV for clarity
        run: npm run test

      - name: Build Frontend
        run: npm run build --prefix frontend
