name: Trend Keyword Infuser CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x] # 'Xtensible' - Test against multiple Node versions

    defaults:
      run:
        working-directory: ./frontend # 'Optimized' - All subsequent steps run here

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json # 'Optimized' - Cache dependencies

    - name: Install Dependencies
      run: npm ci # 'Durable' - Use ci for reproducible builds

    - name: Run Linting
      run: npm run lint

    - name: Run Build
      run: npm run build

    # 'Clairvoyant' - A placeholder for future unit and integration tests.
    # - name: Run Tests
    #   run: npm test
